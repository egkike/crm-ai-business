name: Feature Request
description: Propose a new capability or a change in behaviour
title: "feat: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        This project takes **issues only**; pull requests are closed automatically and
        the maintainer implements accepted work. Full policy:
        [CONTRIBUTING.md](https://github.com/egkike/crm-ai-business/blob/main/CONTRIBUTING.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight
      options:
        - label: I searched the open and closed issues and this is not a duplicate
          required: true
        - label: I understand this repository takes issues only, not pull requests
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - MCP tools (new tool, or arguments / response shape)
        - Tickets / workflow engine (types, states, transitions, rules)
        - Bookings (schedules, slot search, appointment kinds)
        - Internal panel (login, board, editor, settings, reports)
        - Notifications / pending alerts
        - Client identity or channels (WhatsApp, e-mail, Telegram)
        - SQLite storage or schema
        - Hermes / agent connection (gateway contract)
        - Installer or service registration
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you cannot do today, and what it costs you. Lead with this — a request that names the problem can be redesigned; one that only names an implementation usually gets closed as out of scope.
      placeholder: |
        I need to ... but today the only way is ...
        This matters because ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed shape
      description: The behaviour you would like, as concretely as you can state it. A tool call (with input and response) or a panel interaction are the most useful forms.
      placeholder: |
        Tool: get_...
        Input: { ... }
        Response: { ... }
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What you already tried or discarded, and why it was not enough.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Screenshots, related issues, constraints from your deployment.
    validations:
      required: false
