# golangci-lint baseline — v2 config format (golangci-lint 2.14 line).
# The AGENTS.md pipeline runs this before every commit; keep the standard set
# plus the explicit enablements the pre-commit checklist names.
version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - misspell
  settings:
    misspell:
      # User-facing error strings are Spanish by design (AGENTS.md Coding
      # Standards). misspell has no Spanish locale, so flag its false
      # positives here instead of rewording canonical contract messages.
      # Append words as new Spanish texts land — never remove a message's
      # canonical wording to satisfy this linter.
      ignore-rules:
        - proporcion
        - contextos
        - administrar
        - regístrate
        - producto
        - clientes
        - conversacional
        - argumentos
        - problemas
        - columnas

run:
  timeout: 5m
